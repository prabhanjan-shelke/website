<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>Redirecting&hellip;</title>
<script>
var q=new URLSearchParams(window.location.search);
var r=parseInt(q.get('role'),10);
window.location.replace('work.html'+(isNaN(r)?'':'?role='+r));
</script>
<meta http-equiv="refresh" content="0;url=work.html">
</head>
<body><p>Redirecting to <a href="work.html">Work</a>&hellip;</p></body>
</html>
