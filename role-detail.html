<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Role detail &middot; Prabhanjan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,600;1,700&display=swap" rel="stylesheet">
<style>




:root {
  --brass: #C9A227;
  --plum: #6E3B4D;
  --radius: 3px;
}

body[data-theme="work"], body[data-theme="home"], body[data-theme="detail"] {
  --bg: #12151C;
  --bg-raise: #191D26;
  --fg: #E9E7E0;
  --muted: #8B96A5;
  --accent: var(--brass);
  --line: rgba(232, 230, 224, 0.12);
}

body[data-theme="words"] {
  --bg: #EAE2D4;
  --bg-raise: #E2D9C9;
  --fg: #2B2620;
  --muted: #8A7F6C;
  --accent: var(--plum);
  --line: rgba(43, 38, 32, 0.14);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
}
a { color: var(--accent); }

/* ============ TYPE SCALE (Inter only, weight/size carry hierarchy) ============
   Site title (nav wordmark) ... clamp(1.7rem, 4.5vw, 2.2rem)  / 800  <- most eye-catching, brand mark
   Page H1 (hero headings)   ... clamp(2.3rem, 6.5vw, 3.2rem)  / 800
   Role title (per-section)  ... clamp(2.8rem, 8vw, 4.4rem)    / 800  <- biggest single element on Work page
   Card / post H2             ... 1.5rem                        / 700
   Stat number                ... clamp(2.1rem, 5.5vw, 2.8rem) / 800
   Headline / lede            ... clamp(1.1rem, 2.6vw, 1.3rem) / 500
   Body                        ... 1rem                         / 400
   Small label / eyebrow      ... 0.72rem                       / 700, uppercase, tracked
   Meta / caption              ... 0.78rem                      / 500
   Nav links                   ... 0.75rem                      / 600, uppercase, tracked
================================================================================ */

/* ---------- Top nav ---------- */
.topnav {
  position: sticky; top: 0; z-index: 50;
  display: flex; justify-content: space-between; align-items: center;
  padding: 2.1rem clamp(1.25rem, 5vw, 3.5rem) 1.5rem;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.topnav .wordmark {
  font-family: 'Inter', sans-serif; font-weight: 800;
  font-size: clamp(1.7rem, 4.5vw, 2.2rem);
  letter-spacing: -0.02em; text-decoration: none; color: var(--fg);
}
.topnav .navlinks {
  display: flex; gap: clamp(1rem, 3vw, 2rem);
  font-family: 'Inter', sans-serif; font-weight: 600;
  font-size: 0.85rem; letter-spacing: 0.06em;
}
.topnav .navlinks a {
  text-decoration: none; color: var(--muted); padding-bottom: 3px;
  border-bottom: 1px solid transparent; transition: color 0.2s ease, border-color 0.2s ease;
}
.topnav .navlinks a:hover { color: var(--fg); }
.topnav .navlinks a.current { color: var(--accent); border-bottom-color: var(--accent); }

/* hamburger button - hidden on desktop */
.nav-toggle {
  display: none; flex-direction: column; justify-content: center; align-items: center; gap: 5px;
  width: 44px; height: 44px; padding: 0; margin: 0;
  background: none; border: none; cursor: pointer;
}
.nav-toggle span {
  display: block; width: 24px; height: 2px; background: var(--fg); border-radius: 2px;
  transition: transform 0.25s ease, opacity 0.2s ease;
}
.nav-toggle.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.nav-toggle.open span:nth-child(2) { opacity: 0; }
.nav-toggle.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

/* --- narrow screens: collapse nav behind the menu icon --- */
@media (max-width: 560px) {
  .topnav { flex-wrap: wrap; padding: 1.5rem clamp(1.1rem, 5vw, 3.5rem) 1.1rem; }
  .topnav .wordmark { font-size: clamp(1.45rem, 7vw, 1.8rem); }
  .nav-toggle { display: flex; }
  .topnav .navlinks {
    display: none; width: 100%; flex-direction: column; gap: 0;
    margin-top: 1.1rem; border-top: 1px solid var(--line); font-size: 0.95rem;
  }
  .topnav .navlinks.open { display: flex; }
  .topnav .navlinks a {
    padding: 0.95rem 0; border-bottom: 1px solid var(--line); border-top: none;
  }
  .topnav .navlinks a.current { color: var(--accent); border-bottom-color: var(--line); }
}

main { max-width: 820px; margin: 0 auto; padding: 0 clamp(1.25rem, 5vw, 2rem); }

/* ---------- Home page ---------- */
.home-hero { padding: clamp(3rem, 10vh, 6rem) 0 0.5rem; }
.home-eyebrow {
  font-family: 'Inter', sans-serif; font-weight: 700; font-size: 0.85rem;
  letter-spacing: 0.1em; color: var(--accent); text-transform: uppercase; margin-bottom: 1.25rem;
}
.home-hero h1 {
  font-family: 'Inter', sans-serif; font-weight: 800;
  font-size: clamp(2.3rem, 6.5vw, 3.2rem); line-height: 1.15; margin: 0 0 1.75rem;
  letter-spacing: -0.01em; max-width: 14ch;
}
.home-hero .bio p {
  font-family: 'Inter', sans-serif; font-weight: 400;
  font-size: 1.05rem; line-height: 1.75; color: var(--fg); opacity: 0.9;
  max-width: 58ch; margin: 0 0 1.25rem;
}

.home-links { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin: 1.5rem 0 4rem; }
@media (max-width: 560px) { .home-links { grid-template-columns: 1fr; } }
.home-link-card {
  display: block; text-decoration: none;
  border: 1px solid var(--line); border-radius: 6px; padding: 1.75rem;
  transition: border-color 0.25s ease, transform 0.25s ease, background 0.25s ease;
}
.home-link-card.work-card { background: rgba(201, 162, 39, 0.07); }
.home-link-card.words-card { background: rgba(110, 59, 79, 0.16); }
.home-link-card:hover { transform: translateY(-3px); }
.home-link-card.work-card:hover { border-color: var(--brass); }
.home-link-card.words-card:hover { border-color: var(--plum); }
.home-link-card .tag {
  font-family: 'Inter', sans-serif; font-weight: 700; font-size: 0.7rem; letter-spacing: 0.09em;
  text-transform: uppercase; display: block; margin-bottom: 0.6rem;
}
.home-link-card.work-card .tag { color: var(--brass); }
.home-link-card.words-card .tag { color: var(--plum); }
.home-link-card h2 {
  font-family: 'Inter', sans-serif; font-weight: 700; font-size: 1.5rem;
  color: var(--fg); margin: 0 0 0.5rem; letter-spacing: -0.005em;
}
.home-link-card p { color: var(--muted); font-size: 0.92rem; line-height: 1.5; margin: 0; font-weight: 400; }

/* ---------- Work page ---------- */
.work-intro { padding: clamp(2.5rem, 8vh, 4rem) 0 1.5rem; max-width: 640px; }
.work-intro h1 {
  font-family: 'Inter', sans-serif; font-weight: 800;
  font-size: clamp(2.3rem, 6.5vw, 3.2rem); margin: 0 0 0.75rem; letter-spacing: -0.01em;
}
.work-intro p { color: var(--muted); font-size: 1rem; line-height: 1.6; margin: 0; font-weight: 400; }

.role-scroll { scroll-snap-type: y proximity; display: flex; flex-direction: column; gap: 1.75rem; padding: 0.5rem 0 3rem; }

.role-section {
  scroll-snap-align: start;
}

.role-card {
  background: var(--bg-raise);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: clamp(1.75rem, 5vw, 3rem);
}

.role-top { display: flex; align-items: center; gap: 1.5rem; margin-bottom: 1.5rem; }
.role-icon { width: clamp(60px, 10vw, 84px); height: clamp(60px, 10vw, 84px); flex-shrink: 0; opacity: 0.9; }
.role-icon svg { width: 100%; height: 100%; }

.role-heading .role-num {
  font-family: 'Inter', sans-serif; font-weight: 700; font-size: 0.78rem; color: var(--brass);
  letter-spacing: 0.1em; margin-bottom: 0.5rem; display: block;
}
.role-heading h2 {
  font-family: 'Inter', sans-serif; font-weight: 800;
  font-size: clamp(2.1rem, 6.5vw, 3.6rem); line-height: 1.08; margin: 0 0 0.7rem;
  letter-spacing: -0.02em;
}
.role-meta {
  font-family: 'Inter', sans-serif; font-weight: 500; font-size: 0.8rem; color: var(--muted);
}

.role-headline {
  font-family: 'Inter', sans-serif; font-weight: 500;
  font-size: clamp(1.1rem, 2.6vw, 1.3rem); color: var(--fg); opacity: 0.92;
  max-width: 48ch; margin: 0 0 2rem; line-height: 1.5;
}

.role-block { margin-bottom: 1.5rem; }
.role-block-label {
  font-family: 'Inter', sans-serif; font-weight: 700; font-size: 0.72rem; letter-spacing: 0.09em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 0.6rem; display: block;
}
.role-block p {
  font-family: 'Inter', sans-serif; font-weight: 400; font-size: 1rem; line-height: 1.6;
  color: var(--fg); opacity: 0.88; margin: 0; max-width: 62ch;
}
.role-block ul { margin: 0; padding-left: 1.1rem; max-width: 62ch; }
.role-block ul li {
  font-family: 'Inter', sans-serif; font-weight: 400; font-size: 1rem; line-height: 1.6;
  color: var(--fg); opacity: 0.88; margin-bottom: 0.5rem;
}

.role-stats { display: flex; flex-wrap: wrap; gap: clamp(1.5rem, 4vw, 2.5rem); margin: 0.5rem 0 2rem; }
.role-stat {
  display: flex; flex-direction: column; gap: 0.35rem;
  padding-right: clamp(1.5rem, 4vw, 2.5rem);
  border-right: 1px solid var(--line);
}
.role-stat:last-child { border-right: none; padding-right: 0; }
.role-stat .num {
  font-family: 'Inter', sans-serif; font-weight: 800;
  font-size: clamp(2.1rem, 5.5vw, 2.8rem); line-height: 1; color: var(--brass);
  letter-spacing: -0.02em;
}
.role-stat .label {
  font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.68rem; letter-spacing: 0.04em;
  text-transform: uppercase; color: var(--muted); max-width: 16ch; line-height: 1.4;
}

.role-details-link {
  display: inline-flex; align-items: center; gap: 0.4rem;
  font-family: 'Inter', sans-serif; font-weight: 700; font-size: 0.85rem; letter-spacing: 0.02em;
  color: var(--brass); width: fit-content;
  text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 1px;
  padding: 0.95rem 0 0.85rem;
}
.role-details-link:hover { opacity: 0.8; }

/* ---------- Words page ---------- */
.words-intro { padding: clamp(2.5rem, 8vh, 4rem) 0 2rem; max-width: 640px; }
.words-intro h1 {
  font-family: 'Inter', sans-serif; font-weight: 800; font-style: italic;
  font-size: clamp(2.3rem, 6.5vw, 3.2rem); margin: 0 0 0.75rem; letter-spacing: -0.01em;
}
.words-intro p { color: var(--muted); font-size: 1rem; line-height: 1.6; margin: 0; font-weight: 400; }

.posts { display: flex; flex-direction: column; padding-bottom: 4rem; }
.post { border-top: 1px solid var(--line); padding: 2.25rem 0; }
.post:last-child { border-bottom: 1px solid var(--line); }
.post-date {
  font-family: 'Inter', sans-serif; font-weight: 700; font-size: 0.72rem; letter-spacing: 0.09em;
  color: var(--muted); margin-bottom: 0.5rem; text-transform: uppercase;
}
.post h2 {
  font-family: 'Inter', sans-serif; font-weight: 700; font-size: 1.5rem; margin: 0 0 0.6rem;
  letter-spacing: -0.005em;
}
.post p { color: var(--fg); opacity: 0.82; line-height: 1.7; margin: 0; font-size: 1rem; font-weight: 400; }
.post-link {
  display: inline-block; margin-top: 0.4rem;
  font-family: 'Inter', sans-serif; font-weight: 700; font-size: 0.85rem;
  text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 1px;
  padding: 0.95rem 0 0.85rem;
}

/* ---------- Role detail (few-slide viewer) ---------- */
body[data-theme="detail"] { overflow: hidden; height: 100vh; height: 100dvh; }
.detail-topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 20;
  display: flex; justify-content: space-between; align-items: center;
  padding: 1.25rem clamp(1rem, 4vw, 2rem);
  background: linear-gradient(var(--bg), transparent);
}
.detail-back {
  font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.85rem; color: var(--muted);
  text-decoration: none; letter-spacing: 0.03em;
  display: inline-flex; align-items: center; min-height: 44px; padding-right: 0.75rem;
}
.detail-back:hover { color: var(--fg); }
.detail-progress { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.72rem; color: var(--muted); letter-spacing: 0.05em; }

.detail-track { height: 100vh; height: 100dvh; position: relative; }
.detail-slide {
  position: absolute; inset: 0; display: none; flex-direction: column;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: clamp(5rem, 12vh, 7rem) clamp(3.5rem, 11vw, 4rem) clamp(4.5rem, 10vh, 6rem);
}
.detail-slide.showing { display: flex; animation: dfade 0.4s ease; }
@keyframes dfade { from { opacity:0; transform:translateY(8px);} to {opacity:1; transform:translateY(0);} }
.detail-slide-inner { max-width: 640px; width: 100%; margin: auto; }

.detail-cover .role-icon { width: clamp(84px,16vw,120px); height: clamp(84px,16vw,120px); margin: 0 auto 1.75rem; }
.detail-cover { text-align: center; }
.detail-cover .role-num { font-family:'Inter',sans-serif; font-weight:700; font-size:0.8rem; color:var(--brass); letter-spacing:0.12em; }
.detail-cover h1 {
  font-family:'Inter',sans-serif; font-weight:800; font-size: clamp(2rem,7vw,3.4rem);
  line-height: 1.1; margin: 0.6rem 0 0.85rem; letter-spacing: -0.015em;
}
.detail-cover .role-meta { justify-content:center; }
.detail-cover .role-headline { margin: 1.25rem auto 0; }

.detail-content .role-block-label { font-size: 0.78rem; }
.detail-content ul { padding-left: 1.2rem; }
.detail-content ul li {
  font-family:'Inter',sans-serif; font-weight: 400; font-size: clamp(1.05rem,2.6vw,1.25rem);
  line-height:1.6; margin-bottom:0.85rem; color: var(--fg); opacity:0.9;
}
.detail-content .role-metrics { margin-top: 1.5rem; }

.detail-end { text-align: center; }
.detail-end h2 {
  font-family:'Inter',sans-serif; font-weight:700; font-style: italic;
  font-size: clamp(1.5rem,4vw,2.1rem); color: var(--muted); margin: 0 0 2rem;
}
.detail-end-actions { display:flex; gap:0.75rem; flex-wrap:wrap; justify-content:center; }

.detail-nav-zone { position:absolute; top:0; bottom:0; width:15%; cursor:pointer; z-index:5; }
.detail-nav-zone.left{left:0;} .detail-nav-zone.right{right:0;}
.detail-nav-arrow {
  position:absolute; top:50%; transform:translateY(-50%);
  width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:var(--bg-raise);
  color:var(--muted); display:flex; align-items:center; justify-content:center; font-size:1rem; z-index:6; cursor:pointer;
}
.detail-nav-arrow:hover{border-color:var(--brass); color:var(--brass);}
.detail-nav-arrow.prev{left:clamp(0.5rem,2vw,1.5rem);} .detail-nav-arrow.next{right:clamp(0.5rem,2vw,1.5rem);}
.detail-nav-arrow.hidden-arrow{opacity:0; pointer-events:none;}

.detail-dots { position:absolute; bottom:1.5rem; left:0; right:0; display:flex; justify-content:center; gap:0.4rem; z-index:6; }
.detail-dots .dot { width:6px; height:6px; border-radius:50%; background:var(--line); }
.detail-dots .dot.on { background:var(--brass); transform:scale(1.3); }

.role-metrics { display: flex; flex-wrap: wrap; gap: 0.6rem; list-style: none; padding: 0; margin: 0; }
.role-metrics li {
  font-size: 0.82rem; color: var(--muted); font-family: 'Inter', sans-serif; font-weight: 400;
  border: 1px solid var(--line); border-radius: 3px; padding: 0.3rem 0.65rem;
}
.role-metrics .metric { color: var(--brass); font-weight: 700; margin-right: 0.35rem; }

.end-btn {
  all: unset; cursor: pointer;
  font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.78rem;
  letter-spacing: 0.03em; padding: 0.75rem 1.25rem;
  border: 1px solid var(--line); border-radius: 3px; color: var(--fg);
}
.end-btn:hover { border-color: var(--brass); }
.end-btn.primary { border-color: var(--brass); color: var(--brass); }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }





</style>
</head>

const params = new URLSearchParams(window.location.search);
let roleIndex = parseInt(params.get('role'), 10);
if (isNaN(roleIndex) || !ROLES[roleIndex]) roleIndex = 0;

const track = document.getElementById('detail-track');
const backLink = document.getElementById('back-link');
const progressLabel = document.getElementById('progress-label');

backLink.href = `work.html#role-${roleIndex}`;

let currentSlide = -1;

function wrapIcon(inner) {
  return `<svg viewBox="0 0 420 420" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
}

function renderMetrics(metrics) {
  if (!metrics || !metrics.length) return '';
  const items = metrics.map(([v,l]) => `<li><span class="metric">${v}</span>${l}</li>`).join('');
  return `<ul class="role-metrics">${items}</ul>`;
}

function render() {
  const r = ROLES[roleIndex];
  progressLabel.textContent = `Role ${roleIndex+1} of ${ROLES.length}`;
  track.innerHTML = '';

  const cover = document.createElement('div');
  cover.className = 'detail-slide detail-cover';
  cover.dataset.slide = -1;
  cover.innerHTML = `
    <div class="detail-slide-inner">
      <div class="role-icon">${wrapIcon(r.icon)}</div>
      <span class="role-num">${r.num}</span>
      <h1>${r.title}</h1>
      <div class="role-meta">${r.role} &middot; ${r.company} &middot; ${r.dates}</div>
      <p class="role-headline">${r.headline}</p>
    </div>`;
  track.appendChild(cover);

  r.slides.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'detail-slide detail-content';
    el.dataset.slide = i;
    let body = '';
    if (s.type === 'para') {
      body = `<p style="font-family:'Inter',sans-serif;font-weight:400;font-size:clamp(1.1rem,2.8vw,1.35rem);line-height:1.6;opacity:0.9;">${s.text}</p>`;
    } else {
      body = `<ul>${s.items.map(it => `<li>${it}</li>`).join('')}</ul>`;
    }
    el.innerHTML = `
      <div class="detail-slide-inner">
        <span class="role-block-label">${s.label}</span>
        ${body}
        ${i === r.slides.length - 1 ? renderMetrics(r.metrics) : ''}
      </div>`;
    track.appendChild(el);
  });

  const isLast = roleIndex === ROLES.length - 1;
  const end = document.createElement('div');
  end.className = 'detail-slide detail-end';
  end.dataset.slide = r.slides.length;
  end.innerHTML = `
    <div class="detail-slide-inner">
      <h2>${isLast ? "That's the full set, for now." : 'End of this one.'}</h2>
      <div class="detail-end-actions">
        <button class="end-btn" data-action="back">&larr; Back to Work</button>
        ${!isLast ? '<button class="end-btn primary" data-action="next">Next role &rarr;</button>' : ''}
      </div>
    </div>`;
  track.appendChild(end);

  const prevArrow = document.createElement('button');
  prevArrow.className = 'detail-nav-arrow prev'; prevArrow.innerHTML = '&lsaquo;';
  prevArrow.addEventListener('click', () => go(-1));
  track.appendChild(prevArrow);

  const nextArrow = document.createElement('button');
  nextArrow.className = 'detail-nav-arrow next'; nextArrow.innerHTML = '&rsaquo;';
  nextArrow.addEventListener('click', () => go(1));
  track.appendChild(nextArrow);

  const leftZone = document.createElement('div');
  leftZone.className = 'detail-nav-zone left';
  leftZone.addEventListener('click', () => go(-1));
  track.appendChild(leftZone);

  const rightZone = document.createElement('div');
  rightZone.className = 'detail-nav-zone right';
  rightZone.addEventListener('click', () => go(1));
  track.appendChild(rightZone);

  const dots = document.createElement('div');
  dots.className = 'detail-dots';
  r.slides.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot'; d.dataset.dot = i;
    dots.appendChild(d);
  });
  track.appendChild(dots);

  track.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const action = e.target.dataset.action;
      if (action === 'back') window.location.href = `work.html#role-${roleIndex}`;
      if (action === 'next') window.location.href = `role-detail.html?role=${roleIndex+1}`;
    });
  });

  show();
}

function show() {
  const r = ROLES[roleIndex];
  const total = r.slides.length;
  track.querySelectorAll('.detail-slide').forEach(s => {
    s.classList.toggle('showing', parseInt(s.dataset.slide) === currentSlide);
  });
  track.querySelectorAll('.dot').forEach(d => {
    d.classList.toggle('on', parseInt(d.dataset.dot) === currentSlide);
  });
  const prevArrow = track.querySelector('.detail-nav-arrow.prev');
  const nextArrow = track.querySelector('.detail-nav-arrow.next');
  prevArrow.classList.toggle('hidden-arrow', currentSlide === -1);
  nextArrow.classList.toggle('hidden-arrow', currentSlide === total);
}

function go(dir) {
  const r = ROLES[roleIndex];
  const total = r.slides.length;
  const next = currentSlide + dir;
  if (next < -1 || next > total) return;
  currentSlide = next;
  show();
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') go(1);
  if (e.key === 'ArrowLeft') go(-1);
  if (e.key === 'Escape') window.location.href = `work.html#role-${roleIndex}`;
});

render();
</script>
